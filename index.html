<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FailiFasta - Badilisha na Bana Ukubwa wa Picha Papo Hapo</title>
    
    <meta name="description" content="FailiFasta ni zana ya bure ya kubana ukubwa wa picha (compress) na kubadilisha format (JPG, PNG, WEBP) haraka mtandaoni bila bando kubwa.">
    <meta name="keywords" content="FailiFasta, compress image, punguza ukubwa wa picha, badilisha format ya picha, PNG to JPG, WEBP converter">
    <meta property="og:title" content="FailiFasta - Badilisha na Bana Ukubwa wa Picha Papo Hapo">
    <meta property="og:description" content="Punguza MB za picha na badilisha format (JPG, PNG, WEBP) haraka kwenye simu yako bila kupoteza ubora.">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #0f172a;           /* Navy ya Giza - Haiumi macho */
            --card-bg: #1e293b;         /* Slate Grey - Inatenganisha vizuri kadi */
            --card-border: #334155;     /* Border laini */
            
            --text-main: #f8fafc;       /* Mwangaza mwororo wa maandishi */
            --text-muted: #94a3b8;      /* Rangi ya maelezo ya chini */
            
            --accent-blue: #38bdf8;     /* Cyan/Sky Blue mwanana */
            --accent-blue-bg: #0369a1;
            
            --accent-green: #34d399;    /* Soft Mint Green kwa ajili ya Download */
            --accent-green-hover: #059669;
            
            --input-bg: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            max-width: 520px;
            margin: auto;
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--card-border);
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--accent-blue);
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #cbd5e1;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: block;
            text-align: center;
            padding: 16px;
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-blue);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .file-upload-btn:hover {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent-blue);
        }

        select, input[type="range"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            outline: none;
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text-main);
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .range-value {
            font-weight: 700;
            color: var(--accent-blue);
            min-width: 45px;
        }

        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #0f172a;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-download {
            background: var(--accent-green);
            color: #064e3b;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-download:hover {
            background: var(--accent-green-hover);
            color: #ffffff;
        }

        #preview-area {
            display: none;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--card-border);
            text-align: center;
        }

        .preview-box {
            background: var(--input-bg);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--card-border);
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
        }

        .info {
            font-size: 13px;
            color: var(--text-muted);
            margin: 12px 0;
            line-height: 1.6;
        }

        .info b {
            color: var(--text-main);
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FailiFasta 🚀</h1>
        <p>Bana size na badilisha format ya picha haraka bila bando kubwa</p>
    </div>

    <div class="form-group">
        <label>1. Chagua Picha Yako:</label>
        <label for="imageInput" class="file-upload-btn" id="fileLabel">📁 Bonyeza Hapa Kuchagua Picha</label>
        <input type="file" id="imageInput" accept="image/*" onchange="updateFileName()">
    </div>

    <div class="form-group">
        <label>2. Chagua Format Unayotaka:</label>
        <select id="formatSelect">
            <option value="image/jpeg">JPG / JPEG</option>
            <option value="image/png">PNG</option>
            <option value="image/webp">WEBP</option>
        </select>
    </div>

    <div class="form-group">
        <label>3. Ubora wa Picha (Quality / Compression):</label>
        <div class="range-container">
            <input type="range" id="qualityRange" min="0.1" max="1.0" step="0.1" value="0.7" oninput="updateQualityLabel(this.value)">
            <span class="range-value" id="qualityValue">70%</span>
        </div>
    </div>

    <button class="btn" onclick="processImage()">Badilisha na Bana Picha</button>

    <div id="preview-area">
        <label>Picha Yako Mpya Tayari:</label>
        <div class="preview-box">
            <img id="outputImage" alt="Result Preview">
        </div>
        <div class="info" id="fileInfo"></div>
        <a id="downloadBtn" class="btn btn-download" download="failifasta-image">Pakua Picha (Download)</a>
    </div>
</div>

<footer>
    <p>&copy; FailiFasta - Open Source Image Tool | Free & Safe</p>
</footer>

<script>
    function updateFileName() {
        const input = document.getElementById('imageInput');
        const label = document.getElementById('fileLabel');
        if (input.files.length > 0) {
            label.innerText = "✅ Imechaguliwa: " + input.files[0].name;
            label.style.background = "rgba(52, 211, 153, 0.1)";
            label.style.borderColor = "rgba(52, 211, 153, 0.4)";
            label.style.color = "#34d399";
        }
    }

    function updateQualityLabel(val) {
        document.getElementById('qualityValue').innerText = Math.round(val * 100) + '%';
    }

    function processImage() {
        const fileInput = document.getElementById('imageInput');
        const format = document.getElementById('formatSelect').value;
        const quality = parseFloat(document.getElementById('qualityRange').value);

        if (!fileInput.files[0]) {
            alert('Tafadhali chagua picha kwanza!');
            return;
        }

        const file = fileInput.files[0];
        const originalSizeKB = (file.size / 1024).toFixed(1);
        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();
            img.src = event.target.result;

            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;

                const ctx = canvas.getContext('2d');
                
                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                ctx.drawImage(img, 0, 0);

                const convertedUrl = canvas.toDataURL(format, quality);

                const head = 'data:' + format + ';base64,';
                const newSizeBytes = Math.round((convertedUrl.length - head.length) * 3 / 4);
                const newSizeKB = (newSizeBytes / 1024).toFixed(1);

                const outputImg = document.getElementById('outputImage');
                outputImg.src = convertedUrl;

                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = convertedUrl;

                const ext = format.split('/')[1];
                downloadBtn.download = `failifasta-${Date.now()}.${ext}`;

                document.getElementById('fileInfo').innerHTML = 
                    `<b>Ukubwa wa Zamani:</b> ${originalSizeKB} KB | <b>Ukubwa Mpya:</b> ${newSizeKB} KB<br>` +
                    `<b>Vipimo (Resolution):</b> ${img.width} x ${img.height} px`;

                document.getElementById('preview-area').style.display = 'block';
            }
        };

        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
