<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FailiFasta - Universal Converter (Image, Video & Document)</title>
    
    <meta name="description" content="FailiFasta ni zana ya bure ya kubana na kubadilisha format za picha, video kwenda GIF, na PDF.">

    <!-- External Libraries za Video na Documents -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/7.8.2/docx.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-green-hover: #059669;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; padding: 20px 15px; }
        .container { max-width: 550px; margin: auto; background: var(--card-bg); padding: 30px 25px; border-radius: 20px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--card-border); width: 100%; }
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--accent-blue); font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 6px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; color: #cbd5e1; }
        input[type="file"] { display: none; }
        .file-upload-btn { display: block; text-align: center; padding: 16px; background: rgba(56, 189, 248, 0.08); color: var(--accent-blue); border: 2px dashed rgba(56, 189, 248, 0.3); border-radius: 12px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .file-upload-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); }
        select, input[type="number"], input[type="range"] { width: 100%; padding: 12px; border: 1px solid var(--card-border); border-radius: 10px; outline: none; background: var(--input-bg); font-size: 15px; color: var(--text-main); }
        .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .range-container { display: flex; align-items: center; gap: 15px; }
        .range-value { font-weight: 700; color: var(--accent-blue); min-width: 45px; }
        .btn { width: 100%; background: var(--accent-blue); color: #0f172a; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: all 0.2s ease; margin-top: 10px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-download { background: var(--accent-green); color: #064e3b; text-decoration: none; display: block; text-align: center; }
        .btn-download:hover { background: var(--accent-green-hover); color: #ffffff; }
        #preview-area { display: none; margin-top: 25px; padding-top: 20px; border-top: 1px solid var(--card-border); text-align: center; }
        .preview-box { background: var(--input-bg); padding: 12px; border-radius: 12px; margin-bottom: 15px; border: 1px solid var(--card-border); }
        img, video { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 0 auto; }
        .info { font-size: 13px; color: var(--text-muted); margin: 12px 0; line-height: 1.6; }
        .info b { color: var(--text-main); }
        footer { text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>FailiFasta 🚀</h1>
        <p>Badilisha Picha, Video kwenda GIF, na Dokumen (PDF/DOCX)</p>
    </div>

    <div class="form-group">
        <label>1. Chagua Faili Yako (Picha, Video, au PDF/DOCX):</label>
        <label for="fileInput" class="file-upload-btn" id="fileLabel">📁 Bonyeza Hapa Kuchagua Faili</label>
        <input type="file" id="fileInput" accept="image/*,video/*,.pdf,.docx" onchange="handleFileSelect(event)">
    </div>

    <div class="form-group">
        <label>2. Chagua Mchakato Unaotaka (Output Format):</label>
        <select id="formatSelect">
            <optgroup label="Format za Picha">
                <option value="img-jpg">JPG / JPEG</option>
                <option value="img-png">PNG</option>
                <option value="img-webp">WEBP</option>
            </optgroup>
            <optgroup label="Video Conversion">
                <option value="video-gif">Video ➔ Animated GIF (Kipande cha Video)</option>
            </optgroup>
            <optgroup label="Dokumen (Documents)">
                <option value="pdf-to-img">PDF ➔ Picha (JPG)</option>
                <option value="img-to-pdf">Picha ➔ Dokumen ya PDF</option>
            </optgroup>
        </select>
    </div>

    <div class="form-group" id="qualityGroup">
        <label>3. Ubora / Compression Level:</label>
        <div class="range-container">
            <input type="range" id="qualityRange" min="0.1" max="1.0" step="0.1" value="0.8" oninput="updateQualityLabel(this.value)">
            <span class="range-value" id="qualityValue">80%</span>
        </div>
    </div>

    <button class="btn" id="processBtn" onclick="processFile()">Badilisha Faili Papo Hapo</button>

    <div id="preview-area">
        <label>Faili Yako Mpya Tayari:</label>
        <div class="preview-box" id="mediaContainer">
            <img id="outputImage" alt="Result Preview" style="display:none;">
        </div>
        <div class="info" id="fileInfo"></div>
        <a id="downloadBtn" class="btn btn-download" download="failifasta-converted">Pakua Faili (Download)</a>
    </div>
</div>

<footer>
    <p>&copy; FailiFasta - Universal Converter | Free & Safe Client-Side Tool</p>
</footer>

<script>
    let selectedFile = null;

    function updateQualityLabel(val) {
        document.getElementById('qualityValue').innerText = Math.round(val * 100) + '%';
    }

    function handleFileSelect(event) {
        const input = event.target;
        const label = document.getElementById('fileLabel');
        if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            label.innerText = "✅ Imechaguliwa: " + selectedFile.name;
            label.style.background = "rgba(52, 211, 153, 0.1)";
            label.style.borderColor = "rgba(52, 211, 153, 0.4)";
            label.style.color = "#34d399";
        }
    }

    async function processFile() {
        if (!selectedFile) {
            alert('Tafadhali chagua faili kwanza!');
            return;
        }

        const formatChoice = document.getElementById('formatSelect').value;
        const quality = parseFloat(document.getElementById('qualityRange').value);
        const btn = document.getElementById('processBtn');
        
        btn.innerText = "Inachakata... Tafadhali subiri";
        btn.disabled = true;

        try {
            if (formatChoice.startsWith('img-')) {
                await handleImageConversion(formatChoice, quality);
            } else if (formatChoice === 'video-gif') {
                await handleVideoToGif();
            } else if (formatChoice === 'pdf-to-img') {
                await handlePdfToImage();
            }
        } catch (err) {
            alert("Kuna hitilafu imetokea wakati wa kubadilisha faili: " + err.message);
        } finally {
            btn.innerText = "Badilisha Faili Papo Hapo";
            btn.disabled = false;
        }
    }

    function handleImageConversion(formatChoice, quality) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    const ctx = canvas.getContext('2d');

                    let mimeType = 'image/jpeg';
                    let ext = 'jpg';

                    if (formatChoice === 'img-png') { mimeType = 'image/png'; ext = 'png'; }
                    else if (formatChoice === 'img-webp') { mimeType = 'image/webp'; ext = 'webp'; }
                    else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.drawImage(img, 0, 0);
                    const convertedUrl = canvas.toDataURL(mimeType, quality);

                    displayResult(convertedUrl, `failifasta-${Date.now()}.${ext}`, `Format mpya: ${ext.toUpperCase()}`);
                    resolve();
                };
            };
            reader.readAsDataURL(selectedFile);
        });
    }

    function handleVideoToGif() {
        return new Promise((resolve) => {
            if (!selectedFile.type.startsWith('video/')) {
                alert("Tafadhali chagua faili la video!");
                resolve();
                return;
            }

            const video = document.createElement('video');
            video.src = URL.createObjectURL(selectedFile);
            video.muted = true;

            video.onloadeddata = function() {
                video.currentTime = 1; // Kuchukua fremu ya sekunde ya kwanza
            };

            video.onseeked = function() {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth / 2; // Punguza size ili GIF iwe nyepesi
                canvas.height = video.videoHeight / 2;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const gifUrl = canvas.toDataURL('image/gif');
                displayResult(gifUrl, `failifasta-${Date.now()}.gif`, "Video imebadilishwa kuwa GIF Frame.");
                resolve();
            };
        });
    }

    function handlePdfToImage() {
        return new Promise((resolve, reject) => {
            if (selectedFile.type !== 'application/pdf') {
                alert("Tafadhali chagua faili la PDF!");
                resolve();
                return;
            }

            const fileReader = new FileReader();
            fileReader.onload = function() {
                const typedarray = new Uint8Array(this.result);
                pdfjsLib.getDocument(typedarray).promise.then(pdf => {
                    pdf.getPage(1).then(page => {
                        const viewport = page.getViewport({ scale: 1.5 });
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        const renderContext = { canvasContext: ctx, viewport: viewport };
                        page.render(renderContext).promise.then(() => {
                            const imgUrl = canvas.toDataURL('image/jpeg');
                            displayResult(imgUrl, `failifasta-page1.jpg`, "Ukurasa wa 1 wa PDF umebadilishwa kuwa JPG.");
                            resolve();
                        });
                    });
                }).catch(reject);
            };
            fileReader.readAsArrayBuffer(selectedFile);
        });
    }

    function displayResult(url, downloadName, infoText) {
        const outputImg = document.getElementById('outputImage');
        outputImg.src = url;
        outputImg.style.display = 'block';

        const downloadBtn = document.getElementById('downloadBtn');
        downloadBtn.href = url;
        downloadBtn.download = downloadName;

        document.getElementById('fileInfo').innerHTML = `<b>Ujumbe:</b> ${infoText}`;
        document.getElementById('preview-area').style.display = 'block';
    }
</script>

</body>
</html>
