<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FailiFasta - Convert Format Zote za Mafaili</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --input-bg: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 25px 15px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--accent-blue); font-size: 32px; font-weight: 800; }
        .header p { color: var(--text-muted); font-size: 15px; margin-top: 5px; }

        .main-grid {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .category-title {
            color: var(--accent-blue);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .tool-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tool-option:hover {
            border-color: var(--accent-blue);
        }

        .tool-option span { font-size: 14px; font-weight: 600; }
        .tool-option input[type="radio"] { accent-color: var(--accent-blue); }

        .upload-section {
            max-width: 1000px;
            margin: 30px auto 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }

        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block;
            padding: 18px;
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-blue);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #0f172a;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-download {
            background: var(--accent-green);
            color: #064e3b;
            text-decoration: none;
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 700;
        }

        #preview-area { display: none; margin-top: 20px; }
        img, video { max-width: 100%; border-radius: 8px; margin-top: 10px; }
        footer { text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>

<div class="header">
    <h1>FailiFasta 🚀</h1>
    <p>Zana ya haraka ya kubadilisha aina zote za mafaili (Image, Video, Audio & Documents)</p>
</div>

<!-- GRID SYSTEM - ZANA ZOTE ZINAONEKANA WAZI -->
<div class="main-grid">

    <!-- Group 1: Picha -->
    <div class="category-card">
        <div class="category-title">🖼️ Picha (Image Formats)</div>
        <label class="tool-option"><span>PNG ➔ JPG / JPEG</span><input type="radio" name="tool" value="img-jpg" checked></label>
        <label class="tool-option"><span>JPG ➔ PNG</span><input type="radio" name="tool" value="img-png"></label>
        <label class="tool-option"><span>Image ➔ WEBP</span><input type="radio" name="tool" value="img-webp"></label>
        <label class="tool-option"><span>Image ➔ BMP / GIF</span><input type="radio" name="tool" value="img-bmp"></label>
        <label class="tool-option"><span>Picha ➔ PDF</span><input type="radio" name="tool" value="img-to-pdf"></label>
    </div>

    <!-- Group 2: Video -->
    <div class="category-card">
        <div class="category-title">🎬 Video & Animations</div>
        <label class="tool-option"><span>Video ➔ GIF (Animated)</span><input type="radio" name="tool" value="video-gif"></label>
        <label class="tool-option"><span>Video ➔ MP4 / WEBM</span><input type="radio" name="tool" value="video-mp4"></label>
        <label class="tool-option"><span>Video ➔ MP3 (Extract Audio)</span><input type="radio" name="tool" value="video-mp3"></label>
    </div>

    <!-- Group 3: Audio -->
    <div class="category-card">
        <div class="category-title">🎵 Sauti (Audio Formats)</div>
        <label class="tool-option"><span>MP3 ➔ WAV</span><input type="radio" name="tool" value="audio-wav"></label>
        <label class="tool-option"><span>WAV / AAC ➔ MP3</span><input type="radio" name="tool" value="audio-mp3"></label>
        <label class="tool-option"><span>MP3 + Image ➔ MP4 Video</span><input type="radio" name="tool" value="mp3-to-mp4"></label>
    </div>

    <!-- Group 4: Documents -->
    <div class="category-card">
        <div class="category-title">📄 Documents</div>
        <label class="tool-option"><span>PDF ➔ Picha (JPG)</span><input type="radio" name="tool" value="pdf-to-jpg"></label>
        <label class="tool-option"><span>DOCX ➔ PDF</span><input type="radio" name="tool" value="docx-to-pdf"></label>
        <label class="tool-option"><span>PDF ➔ DOCX</span><input type="radio" name="tool" value="pdf-to-docx"></label>
    </div>

</div>

<!-- SEHEMU YA UPLOAD NA MCHAKATO -->
<div class="upload-section">
    <label for="fileInput" class="file-upload-btn" id="fileLabel">📁 Chagua Faili Yako Hapa Ku-convert</label>
    <input type="file" id="fileInput" onchange="updateFileName()">

    <button class="btn" onclick="processConversion()">Anza Kubadilisha Faili</button>

    <div id="preview-area">
        <div id="statusMessage"></div>
        <a id="downloadBtn" class="btn-download" download="failifasta-file">Pakua Faili Lako (Download)</a>
    </div>
</div>

<footer>
    <p>&copy; FailiFasta - Universal Converter | Multi-Format Support</p>
</footer>

<script>
    function updateFileName() {
        const input = document.getElementById('fileInput');
        const label = document.getElementById('fileLabel');
        if (input.files.length > 0) {
            label.innerText = "✅ Faili Lililochaguliwa: " + input.files[0].name;
            label.style.background = "rgba(52, 211, 153, 0.1)";
            label.style.color = "#34d399";
        }
    }

    function processConversion() {
        const fileInput = document.getElementById('fileInput');
        if (!fileInput.files[0]) {
            alert("Tafadhali chagua faili kwanza!");
            return;
        }

        const selectedTool = document.querySelector('input[name="tool"]:checked').value;
        const previewArea = document.getElementById('preview-area');
        const statusMessage = document.getElementById('statusMessage');
        const downloadBtn = document.getElementById('downloadBtn');

        statusMessage.innerHTML = "<b>Inabadilisha...</b> Tafadhali subiri.";
        previewArea.style.display = "block";

        // Mfano wa Process ya Output
        setTimeout(() => {
            statusMessage.innerHTML = `✅ Mabadiliko ya <b>${selectedTool.toUpperCase()}</b> Yamekamilika!`;
            downloadBtn.style.display = "inline-block";
        }, 1500);
    }
</script>

</body>
</html>
