<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FailiFasta - Universal File Converter & Compressor</title>
    
    <!-- PDF Library Reloaded with Backup CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-green: #34d399;
            --accent-green-hover: #059669;
            --input-bg: #0f172a;
            --danger-red: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px 15px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { color: var(--accent-blue); font-size: 32px; font-weight: 800; }
        .header p { color: var(--text-muted); font-size: 14px; margin-top: 5px; }

        .container {
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .category-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
        }

        .category-title {
            color: var(--accent-blue);
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 5px;
        }

        .tool-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .tool-option input { accent-color: var(--accent-blue); }

        .action-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
        }

        input[type="file"] { display: none; }
        .file-upload-btn {
            display: block;
            padding: 15px;
            background: rgba(56, 189, 248, 0.08);
            color: var(--accent-blue);
            border: 2px dashed rgba(56, 189, 248, 0.3);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
        input[type="number"], input[type="range"] {
            width: 100%;
            padding: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-main);
        }

        .btn {
            width: 100%;
            background: var(--accent-blue);
            color: #0f172a;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        #preview-area {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: var(--input-bg);
            border: 1px solid var(--accent-green);
            border-radius: 12px;
            text-align: center;
        }

        .btn-download {
            display: inline-block;
            background: var(--accent-green);
            color: #064e3b;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 800;
            text-decoration: none;
            margin-top: 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .btn-reset {
            display: inline-block;
            background: transparent;
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 12px;
            margin-top: 15px;
            cursor: pointer;
        }

        .file-stats { font-size: 13px; color: var(--text-muted); margin: 10px 0; }

        footer { text-align: center; margin-top: 30px; color: var(--text-muted); font-size: 12px; }
    </style>
</head>
<body>

<div class="header">
    <h1>FailiFasta 🚀</h1>
    <p>Fast & Free Client-Side File Converter & Resizer</p>
</div>

<div class="container">

    <div class="main-grid">
        <div class="category-card">
            <div class="category-title">🖼️ Image Converters</div>
            <label class="tool-option"><span>PNG to JPG</span><input type="radio" name="tool" value="img-jpg" checked></label>
            <label class="tool-option"><span>JPG to PNG</span><input type="radio" name="tool" value="img-png"></label>
            <label class="tool-option"><span>Convert to WEBP</span><input type="radio" name="tool" value="img-webp"></label>
        </div>

        <div class="category-card">
            <div class="category-title">📄 Document Tools</div>
            <label class="tool-option"><span>Image to PDF</span><input type="radio" name="tool" value="img-pdf"></label>
        </div>

        <div class="category-card">
            <div class="category-title">⚙️ Fast Compressor</div>
            <label class="tool-option"><span>Compress File Size</span><input type="radio" name="tool" value="compress"></label>
        </div>
    </div>

    <div class="action-card">
        <label for="fileInput" class="file-upload-btn" id="fileLabel">📁 Click Here to Choose Image</label>
        <input type="file" id="fileInput" accept="image/*" onchange="loadFile(event)">

        <div class="controls-grid">
            <div>
                <label>Quality / Compression (<span id="qualVal">80</span>%)</label>
                <input type="range" id="qualityRange" min="10" max="100" value="80" oninput="document.getElementById('qualVal').innerText = this.value">
            </div>
            <div>
                <label>Max Width Pixels (Optional)</label>
                <input type="number" id="maxWidth" placeholder="e.g. 1080">
            </div>
        </div>

        <button class="btn" onclick="convertAndCompress()">Convert & Process File</button>

        <div id="preview-area">
            <h3>✅ File Ready for Download!</h3>
            <div class="file-stats" id="fileStats"></div>
            <img id="previewImg" style="max-width: 150px; border-radius: 6px; margin: 10px auto; display:none;">
            <br>
            <a id="downloadBtn" class="btn-download" href="#" onclick="handleDownload()">⬇️ Download File Now</a>
            <br>
            <button class="btn-reset" onclick="resetForm()">Clear & Process Another File</button>
        </div>
    </div>

</div>

<footer>
    <p>&copy; FailiFasta | Safe Client-Side Image & PDF Converter</p>
</footer>

<script>
    let currentLoadedFile = null;

    function loadFile(event) {
        const input = event.target;
        if (input.files && input.files[0]) {
            currentLoadedFile = input.files[0];
            const label = document.getElementById('fileLabel');
            label.innerText = "✅ Selected: " + currentLoadedFile.name;
            label.style.borderColor = "#34d399";
            label.style.color = "#34d399";
        }
    }

    function convertAndCompress() {
        if (!currentLoadedFile) {
            alert("Please choose an image file first!");
            return;
        }

        const selectedTool = document.querySelector('input[name="tool"]:checked').value;
        const quality = parseFloat(document.getElementById('qualityRange').value) / 100;
        const maxWidth = parseInt(document.getElementById('maxWidth').value);

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;

            img.onload = function() {
                try {
                    let width = img.width;
                    let height = img.height;

                    if (maxWidth && width > maxWidth) {
                        height = Math.round((height * maxWidth) / width);
                        width = maxWidth;
                    }

                    // CONVERT TO PDF (SAFE LOAD CHECK)
                    if (selectedTool === 'img-pdf') {
                        if (!window.jspdf || !window.jspdf.jsPDF) {
                            alert("PDF Library is still loading. Please try again in 3 seconds.");
                            return;
                        }
                        const { jsPDF } = window.jspdf;
                        const doc = new jsPDF({
                            orientation: width > height ? 'landscape' : 'portrait',
                            unit: 'px',
                            format: [width, height]
                        });

                        doc.addImage(img.src, 'JPEG', 0, 0, width, height);
                        const pdfDataUri = doc.output('datauristring');

                        const downloadBtn = document.getElementById('downloadBtn');
                        downloadBtn.href = pdfDataUri;
                        downloadBtn.download = `failifasta-${Date.now()}.pdf`;

                        document.getElementById('previewImg').style.display = 'none';
                        document.getElementById('fileStats').innerHTML = `Format: <b>PDF Document</b> | Dimensions: <b>${width}x${height} px</b>`;
                        document.getElementById('preview-area').style.display = 'block';
                        return;
                    }

                    // CONVERT TO IMAGE FORMATS (JPG, PNG, WEBP)
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');

                    let formatType = 'image/jpeg';
                    let ext = 'jpg';

                    if (selectedTool === 'img-png') { formatType = 'image/png'; ext = 'png'; }
                    else if (selectedTool === 'img-webp') { formatType = 'image/webp'; ext = 'webp'; }
                    else {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL(formatType, quality);

                    const downloadBtn = document.getElementById('downloadBtn');
                    downloadBtn.href = dataUrl;
                    downloadBtn.download = `failifasta-${Date.now()}.${ext}`;

                    const previewImg = document.getElementById('previewImg');
                    previewImg.src = dataUrl;
                    previewImg.style.display = 'block';

                    const origSize = (currentLoadedFile.size / 1024).toFixed(1);
                    const head = 'data:' + formatType + ';base64,';
                    const newSize = ((dataUrl.length - head.length) * 3 / 4 / 1024).toFixed(1);

                    document.getElementById('fileStats').innerHTML = 
                        `Original Size: <b>${origSize} KB</b> | New Size: <b>${newSize} KB</b><br>` +
                        `Dimensions: <b>${width} x ${height} px</b>`;

                    document.getElementById('preview-area').style.display = 'block';
                } catch (err) {
                    alert("Error processing file: " + err.message);
                }
            }
        };

        reader.readAsDataURL(currentLoadedFile);
    }

    function handleDownload() {
        setTimeout(() => {
            resetForm();
        }, 800);
    }

    function resetForm() {
        currentLoadedFile = null;
        document.getElementById('fileInput').value = "";
        
        const label = document.getElementById('fileLabel');
        label.innerText = "📁 Click Here to Choose Image";
        label.style.borderColor = "rgba(56, 189, 248, 0.3)";
        label.style.color = "#38bdf8";

        document.getElementById('preview-area').style.display = 'none';
        document.getElementById('previewImg').style.display = 'none';
    }
</script>

</body>
</html>
